<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Restaurant account</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(
                rgba(0,0,0,0.5),
                rgba(0,0,0,0.5)
            ),
            url("https://images.unsplash.com/photo-1504674900247-0877df9cc836")
            center/cover;
        }

        .account-box {
            width: 350px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }

        .account-box h1 {
            color: #e65100;
            margin-bottom: 10px;
        }

        .account-box p {
            color: #555;
            margin-bottom: 25px;
        }

        .input-box {
            margin-bottom: 15px;
        }

        .input-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        .input-box input:focus {
            border-color: #e65100;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #e65100;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #bf360c;
        }

        .links {
            margin-top: 20px;
            font-size: 14px;
        }

        .links a {
            color: #e65100;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="account-box">
        <h1>🍽️ Food Palace</h1>
        <p>account to order your favorite meals</p>

        <form>
            <div class="input-box">
                <input type="email" placeholder="Enter Email" required>
            </div>

            <div class="input-box">
                <input type="password" placeholder="Enter Password" required>
            </div>

            <button type="submit">login</button>

            <div class="links">
                <p>Don't have an account?
                    <a href="#">Register</a>
                </p>
                <a href="#">Forgot Password?</a>
            </div>
        </form>
    </div>

</body>
</html>
